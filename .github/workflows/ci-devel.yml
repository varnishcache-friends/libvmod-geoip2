name: ci-devel

on:
  push:
    branches: [devel, main]
  pull_request:
  schedule:
    - cron: "11 3 * * 6"

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        compiler: [clang, gcc]

    steps:
      - uses: varnishcache-friends/setup-vinyl@v2
      - run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config python3-docutils libmaxminddb-dev
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - run: ./autogen.sh
      - name: enable gcov
        if: matrix.compiler == 'gcc'
        run: echo "CONFIGURE_ARGS=--enable-gcov" >> $GITHUB_ENV
      - name: configure
        run: CC=${{ matrix.compiler }} ./configure CFLAGS="-Wall -Wextra -Werror" $CONFIGURE_ARGS
      - run: make
      - run: make check VERBOSE=1
      - name: codecov
        if: matrix.compiler == 'gcc'
        run: |
          curl -Os https://uploader.codecov.io/latest/linux/codecov
          chmod +x codecov
          ./codecov -v -f src/.libs/libvmod-geoip2.info -t ${{ secrets.CODECOV_TOKEN }}
      - run: make distcheck
